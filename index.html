<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
:root{--blue:#1d4ed8;--text:#111827;--mute:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:12vh 24px 48px}
h1{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 40px}
.hide{display:none}
label{display:block;font-size:22px;margin-bottom:16px}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:10px 0;border:0;border-bottom:1px solid var(--line);outline:none;border-radius:0;background:transparent}
input[type=text]:focus{border-bottom-color:var(--blue)}
button{font:inherit;font-size:15px;cursor:pointer;padding:10px 18px;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue)}
button:hover{background:#eff6ff}
button.primary{background:var(--blue);color:#fff;margin-top:24px}
button.primary:hover{background:#1e40af}
.err{color:#b91c1c;font-size:14px;margin:10px 0 0;min-height:1.2em}
.hello{font-size:22px;margin:0 0 24px}
.pw{border-left:2px solid var(--blue);padding:4px 0 4px 18px;font-size:clamp(20px,5vw,26px);line-height:1.6;word-break:break-word}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.row button.primary{margin-top:0}
.opt{margin-top:24px;color:var(--mute);font-size:14px}
select{font:inherit;padding:2px 4px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--text)}
.bar{height:2px;background:var(--line);margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue)}
.tip{margin-top:24px;font-size:13px;color:var(--mute)}
.link{border:0;padding:0;margin-top:32px;font-size:14px;color:var(--mute);background:none;text-decoration:underline}
.link:hover{background:none;color:var(--blue)}
.hint{color:var(--mute);font-size:15px;margin:0 0 20px}
.and{color:var(--blue);font-weight:700}
.sentence{min-height:3.4em}
.combo{position:relative;margin-top:24px}
.count{font-size:13px;color:var(--mute);margin:8px 0 0}
.list{position:absolute;left:0;right:0;top:calc(100% - 28px);margin:0;padding:4px 0;list-style:none;background:#fff;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto;box-shadow:0 8px 24px rgba(17,24,39,.08);z-index:5}
.list li{padding:8px 14px;cursor:pointer}
.list li.on{background:#eff6ff;color:var(--blue)}
.list li.none{color:var(--mute);cursor:default}
.list b{color:var(--blue)}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{background:#fff}
button.primary:disabled:hover{background:var(--blue)}
.big{font-size:clamp(34px,9vw,52px);font-weight:700;color:var(--blue);margin:0 0 12px;line-height:1.1}
footer{max-width:480px;margin:0 auto;padding:0 24px 32px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <noscript><p class="err">JavaScript is turned off or blocked here. Open this file in Chrome, Edge, Firefox or Safari.</p></noscript>

  <section id="step1">
    <form id="nameForm" autocomplete="off">
      <label for="user">What’s your username?</label>
      <input id="user" type="text" maxlength="30" autofocus>
      <p id="err" class="err"></p>
      <button class="primary" type="submit">Continue</button>
    </form>
  </section>

  <section id="step2" class="hide">
    <p class="hello" id="hello"></p>
    <p class="hint">This is your password. Say it out loud and picture it as a tiny story, then press Next.</p>
    <div class="pw sentence" id="pw"></div>
    <div class="row">
      <button id="copy" type="button">Copy</button>
      <button class="primary" id="next" type="button">Next →</button>
    </div>
    <button class="link" id="back" type="button">Change username</button>
  </section>

  <section id="step3" class="hide">
    <p class="hello" id="hello3"></p>
    <p class="hint">Enter your password. Start typing each word and pick it from the list.</p>
    <div class="pw sentence" id="entry"></div>
    <div class="combo" id="combo">
      <input id="word" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the first letters…">
      <ul class="list hide" id="list"></ul>
    </div>
    <p class="count" id="count"></p>
    <p class="err" id="msg"></p>
    <div class="row">
      <button class="primary" id="check" type="button" disabled>Enter</button>
      <button id="clear" type="button">Start over</button>
    </div>
    <button class="link" id="seeagain" type="button">Show my password again</button>
  </section>

  <section id="step4" class="hide">
    <p class="big">Congrats!</p>
    <p class="hello" id="welcome"></p>
    <button class="link" id="restart" type="button" style="margin-top:8px">Start again</button>
  </section>
</main>
<footer>Everything stays in your browser. Nothing is sent or saved.</footer>

<script>window.addEventListener('error',function(e){var el=document.getElementById('err');if(el)el.textContent='Something went wrong: '+e.message;});</script>
<script>
/* ===== WORD LISTS (edit freely: words separated by spaces) ===== */
/* Each line reads like a tiny story:  [ADJ_WHO] [WHO] [VERB] [ADJ_THING] [THING]  e.g. "sleepy fox found shiny teapot" */
const ADJ_WHO = `happy brave shy proud kind silly funny jolly sunny lucky calm quiet loud noisy busy lazy dizzy furry fuzzy tiny small big huge giant tall short quick
fast slow swift tough wise smart eager keen bold shiny tidy neat fancy plain dusty muddy soggy sandy snowy icy cozy warm tired awake alert ready loyal
jumpy merry glad sweet plump slim lean fit fresh young old mini grand royal odd weird goofy red blue green pink brown black white gray navy mint lime
lemon berry plum olive tan cream honey salty spicy tasty yummy juicy slimy bumpy lumpy curly wavy spiky flat thick thin wide deep dark light pale
rusty leafy rocky windy rainy foggy misty nice good great super cool cute sad mad angry rich early late first last next only lone bossy witty nutty
fussy messy fiery sly sharp round oval bald hairy daily shaky sorry fair sleek baby able bad dear dull easy fine firm free gold hard high just low
main mean mild open poor pure rare raw real ripe rude safe sane sick soft sour tame vast weak wet wild zany rose ruby jade rust lanky bony lithe stout
noble regal magic clean close crazy dandy edgy fishy fizzy gooey handy itchy mushy perky risky rowdy wacky zesty zippy avid brisk daft dim dry fond
gruff hip hot idle lush meek nosy rash snug sure trim wary cheer peach new long`;

const WHO = `dog cat bird fish horse cow pig sheep goat duck mouse rat bear wolf fox deer frog snake whale shark crab bee ant fly moth owl hawk eagle swan goose
lamb calf pony camel zebra lion tiger ape panda koala seal otter skunk mole bat crow raven dove robin toad snail worm wasp squid eel trout stork crane
heron hen bull puppy cub fawn bunny rhino hippo bison moose llama sloth baker pilot witch king queen giant fairy elf dwarf troll ghost robot alien
clown chef cook nurse miner mayor judge guard poet ninja skier hiker coach uncle aunt baby kid boy girl man woman twin hero angel gnome pixie genie
yeti mom dad nanny buddy pal guest host boss chief rival fan star clerk actor yak ram swift kiwi tuna cod bass carp mule hare stag doe buck elk hound
pup tabby kitty gull flea lord duke scout spy agent thief vet diver maid child teen elder human mate jay boar bug clam hog newt tick cop dame fool
lady rider bride crew guide owner`;

const VERBS = `found lost held threw hid stole lent sold gave sent took dried swept wiped drew tied bent broke fixed built made sawed glued taped sewed baked fried
mixed bit piled loved liked chose saved kept shook spun swung waved named heard felt tried used wore blew burst poked shut hung cut tore lit froze won
dug rowed got put set moved flung fed tamed rang beat drove rode flew typed saw ate drank wrote met hit split spent paid told sang sank knew woke
added asked hoped raced voted bled did fled grew had laid led left quit ran read said sat shot slid stuck swam aimed based caged cared coded cured
dated dived dyed eased ended faced faded gazed hated hired joked lined lived noted owned paced paved rated ruled sized timed towed waded waxed wired
bound bowed cried dared dined eyed faked fared filed fined fired hiked laced mowed raked spied urged aided armed`;

const ADJ_THING = `red blue green pink brown black white gray navy lime peach lemon minty plum olive cream honey big small tiny large huge giant long short tall wide
thick thin flat round oval curly bumpy rough soft hard heavy light shiny dull clean dirty dusty muddy new old fancy plain torn rusty metal glass paper
silk stone iron steel clay tin brass straw wet dry damp warm cool hot cold icy sweet sour salty spicy tasty juicy fresh ripe empty full open lost
spare extra magic lucky odd funny silly plaid loud quiet noisy solid tidy messy neat cute fuzzy furry hairy scaly slimy fizzy neon dark pale mini
jumbo tough weak shaky good bad nice fine great yummy fur wool felt foam rocky snowy sunny rainy foggy twin cheap free royal sharp wild tame young
baby grown aged lumpy sandy silky spiky stiff loose tight cozy leafy rose blush sky sea shady brick oak pine gold slim plump happy sad proud shy brave
first third last final only lone even rare usual dizzy giddy goofy mint tan curvy slick used worn shut stale crisp soggy wood cloth lace best pair
next sly fair windy wavy`;

const THINGS = `ball kite doll drum flute harp bell horn cup mug glass plate bowl spoon fork knife pan pot jug jar tray apple grape lemon peach pear plum melon berry
mango onion corn pea bean bread cake pie egg pizza donut candy olive honey jam hat cap scarf glove sock shoe boot coat shirt dress skirt belt tie
apron mask ring purse bag saw drill rake rope chain hook nail screw bolt tape glue brush broom mop torch pen ruler book map stamp card clock watch
phone radio lamp chair stool bench table desk bed quilt rug towel soap comb vase frame key lock fan rock stone shell leaf stick seed acorn twig nest
coin crown medal flag box crate chest sword bow arrow wand sled tent canoe kayak oar teddy robot plane train boat truck car bus wagon cart wheel sink
spade axe bacon ham steak soup salad sauce syrup sugar salt flour rice pasta toast cream milk juice tea cocoa soda kiwi fig date cloud moon star sun
piano taco sofa couch stove oven bulb cable yarn cord wire pin clip bill penny bunch match dice cards chess sign photo chalk paint cone bun roll chip
fries roast stew chili jelly gum mint can tin bin mixer straw lid tap tube robe vest jeans pants cape hood cot shelf rack swing slide log hose raft
taxi van pearl gold mouse top bat skis tower wall gate door roof barn shed net toy web wig bike brick game gift iron lace mat note nut page paper pill
pipe plug pole pool rose sail sand seat sheet suit tool tree tub wool zip beef crab fish lime meat oat pork tuna lake pond hill road jet ship sub
skate club puck bear block`;

/* ===== LOGIC (no need to edit below) ===== */
const words = s => [...new Set(s.trim().split(/\s+/))];      // removes duplicates
const A1 = words(ADJ_WHO), N = words(WHO), A2 = words(ADJ_THING), O = words(THINGS);
const V = words(VERBS).map(x => x.split(':'));

// Cryptographically secure, unbiased random number from 0 to max-1
function rand(max){
  const buf = new Uint32Array(1), limit = Math.floor(4294967296 / max) * max;
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return buf[0] % max;
}
const pick = a => a[rand(a.length)];

function line(){
  const [v, p] = pick(V);
  return [pick(A1), pick(N), p ? v + ' ' + p : v, pick(A2), pick(O)].join(' ');
}

/* ===== PAGE ===== */
const $ = id => document.getElementById(id);
const VW = V.map(x => x[0]);   // plain verb words (no prepositions)
const ORDER = [A1, N, VW, A2, O, A1, N, VW, A2, O];   // which list each of the 10 words comes from
let username = '', pw = [], entered = [], matches = [], active = 0;

function show(id){ ['step1','step2','step3','step4'].forEach(s => $(s).classList.toggle('hide', s !== id)); }

// Draws the words as one sentence: line 1, then "and" (blue, bold) + line 2
function sentence(el, words){
  el.innerHTML = '';
  if (!words.length) return;
  const l1 = document.createElement('div'); l1.textContent = words.slice(0,5).join(' '); el.appendChild(l1);
  if (words.length >= 5){
    const l2 = document.createElement('div'), a = document.createElement('span');
    a.className = 'and'; a.textContent = 'and';
    l2.appendChild(a); l2.appendChild(document.createTextNode(' ' + words.slice(5).join(' ')));
    el.appendChild(l2);
  }
}

/* step 1 -> 2 */
$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('user').value.trim();
  if (!name){ $('err').textContent = 'Please type a username first.'; return; }
  $('err').textContent = '';
  username = name;
  pw = (line() + ' ' + line()).split(' ');
  $('hello').textContent = 'Hi, ' + username + '.';
  sentence($('pw'), pw);
  $('copy').textContent = 'Copy';
  show('step2');
});
$('back').onclick = () => { show('step1'); $('user').focus(); };
$('copy').onclick = async () => {
  const text = pw.slice(0,5).join(' ') + ' and ' + pw.slice(5).join(' ');
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove();
  }
  $('copy').textContent = 'Copied ✓';
};

/* step 2 -> 3 */
$('next').onclick = () => {
  entered = []; $('msg').textContent = '';
  $('hello3').textContent = 'Welcome back, ' + username + '.';
  renderEntry(); show('step3'); $('word').focus();
};
$('seeagain').onclick = () => show('step2');
$('clear').onclick = () => { entered = []; $('msg').textContent = ''; renderEntry(); $('word').focus(); };

function renderEntry(){
  sentence($('entry'), entered);
  const done = entered.length >= 10;
  $('combo').classList.toggle('hide', done);
  $('count').textContent = done ? 'All 10 words are in. Press Enter.' : 'Word ' + (entered.length + 1) + ' of 10';
  $('check').disabled = !done;
  $('word').value = ''; hideList();
}

/* the drop-down: filters the words as the user types letters */
function hideList(){ $('list').classList.add('hide'); $('list').innerHTML = ''; matches = []; }
function setActive(i){
  const items = $('list').children; if (!matches.length) return;
  active = (i + matches.length) % matches.length;
  [...items].forEach((li, k) => li.classList.toggle('on', k === active));
  items[active].scrollIntoView({block: 'nearest'});
}
function showList(){
  const q = $('word').value.trim().toLowerCase(), list = $('list');
  list.innerHTML = ''; matches = [];
  if (!q || entered.length >= 10){ list.classList.add('hide'); return; }
  matches = ORDER[entered.length].filter(w => w.startsWith(q));
  if (!matches.length){
    const li = document.createElement('li'); li.className = 'none'; li.textContent = 'No word starts with that';
    list.appendChild(li);
  } else {
    matches.forEach(w => {
      const li = document.createElement('li'), b = document.createElement('b');
      b.textContent = w.slice(0, q.length);
      li.appendChild(b); li.appendChild(document.createTextNode(w.slice(q.length)));
      li.addEventListener('mousedown', ev => { ev.preventDefault(); choose(w); });
      list.appendChild(li);
    });
  }
  list.classList.remove('hide');
  setActive(0);
}
function choose(w){ entered.push(w); $('msg').textContent = ''; renderEntry(); if (entered.length < 10) $('word').focus(); }

$('word').addEventListener('input', showList);
$('word').addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== $('word')) hideList(); }, 120));
$('word').addEventListener('keydown', e => {
  const q = $('word').value.trim().toLowerCase();
  if (e.key === 'ArrowDown'){ e.preventDefault(); setActive(active + 1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); setActive(active - 1); }
  else if (e.key === 'Enter' || e.key === 'Tab'){
    if (matches.length){ e.preventDefault(); choose(matches[active]); }
    else if (e.key === 'Enter'){ e.preventDefault(); check(); }
  }
  else if (e.key === ' '){ e.preventDefault(); if (matches.includes(q)) choose(q); }
  else if (e.key === 'Escape'){ hideList(); }
  else if (e.key === 'Backspace' && !$('word').value && entered.length){ entered.pop(); renderEntry(); }
});

/* step 3 -> 4 */
function check(){
  if (entered.length < 10) return;
  if (entered.join(' ') === pw.join(' ')){
    $('welcome').textContent = 'You’re in, ' + username + '.';
    show('step4');
  } else {
    $('msg').textContent = 'That doesn’t match. Please try again.';
    entered = []; renderEntry(); $('word').focus();
  }
}
$('check').onclick = check;
$('restart').onclick = () => { show('step1'); $('user').focus(); };
</script>
</body>
</html>
